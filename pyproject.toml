[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-calculator"
version = "2.0.0"
description = "Desktop calculator with sign-in, history and a safe expression engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sampathraj B M" }]

[project.scripts]
sam-calculator = "sam_calculator.__main__:main"

[tool.setuptools]
packages = ["sam_calculator"]
